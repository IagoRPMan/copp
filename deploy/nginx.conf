# Troque copp.exemplo.com.br pelo dominio real e emita o certificado
# (por exemplo: certbot --nginx -d copp.exemplo.com.br).

server {
    listen 80;
    server_name copp.exemplo.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name copp.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/copp.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copp.exemplo.com.br/privkey.pem;

    # O export do PaperCut de um mes inteiro pode passar de 1 MB.
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
